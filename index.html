<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DSA Daily Tracker</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0d1117;
    color:#e6edf3;
    font-family:Arial, sans-serif;
    padding:40px;
}

.container{
    max-width:1100px;
    margin:auto;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.title h1{
    font-size:28px;
}

.title p{
    color:#8b949e;
    margin-top:6px;
}

/* MONTH */

.month{
    display:flex;
    align-items:center;
    gap:15px;
}

.month button{
    background:#161b22;
    color:white;
    border:1px solid #30363d;
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
}

.month button:hover{
    background:#21262d;
}

#monthName{
    font-weight:bold;
}

/* STATS */

.stats{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

.stat{
    background:#161b22;
    border:1px solid #30363d;
    padding:18px 25px;
    border-radius:8px;
    min-width:150px;
}

.stat p{
    color:#8b949e;
    font-size:13px;
    margin-bottom:7px;
}

.stat h2{
    font-size:24px;
}

/* LEGEND */

.legend{
    display:flex;
    gap:20px;
    margin-bottom:18px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:#8b949e;
}

.legend-box{
    width:13px;
    height:13px;
    border-radius:3px;
}

.green{
    background:#39d353;
}

.orange{
    background:#f0883e;
}

.blue{
    background:#58a6ff;
}

/* CALENDAR */

.calendar{
    background:#161b22;
    border:1px solid #30363d;
    padding:25px;
    border-radius:10px;
    overflow-x:auto;
}

.weekdays{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:7px;
    margin-bottom:10px;
}

.weekdays div{
    text-align:center;
    color:#8b949e;
    font-size:12px;
}

/* DAYS */

.grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:7px;
}

.day{
    min-height:85px;
    border:1px solid #30363d;
    border-radius:6px;
    padding:7px;
    background:#0d1117;
}

.day-number{
    font-size:12px;
    color:#8b949e;
    margin-bottom:8px;
}

/* TASK BUTTONS */

.tasks{
    display:flex;
    gap:5px;
}

.task{
    width:19px;
    height:19px;
    border-radius:4px;
    border:1px solid #30363d;
    cursor:pointer;
    transition:.15s;
}

.task:hover{
    transform:scale(1.1);
}

/* ACTIVE */

.video.active{
    background:#39d353;
    border-color:#39d353;
}

.leetcode.active{
    background:#f0883e;
    border-color:#f0883e;
}

.github.active{
    background:#58a6ff;
    border-color:#58a6ff;
}

/* EMPTY DAYS */

.empty{
    visibility:hidden;
}

/* MOBILE */

@media(max-width:700px){

    body{
        padding:20px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
    }

    .stats{
        flex-wrap:wrap;
    }

    .stat{
        flex:1;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="title">

            <h1>DSA Daily Tracker</h1>

            <p>
                One video • One LeetCode • One GitHub push
            </p>

        </div>

        <div class="month">

            <button onclick="previousMonth()">‹</button>

            <span id="monthName"></span>

            <button onclick="nextMonth()">›</button>

        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <p>📺 VIDEOS</p>

            <h2 id="videoCount">0</h2>

        </div>

        <div class="stat">

            <p>🟧 LEETCODE</p>

            <h2 id="leetcodeCount">0</h2>

        </div>

        <div class="stat">

            <p>🔵 GITHUB</p>

            <h2 id="githubCount">0</h2>

        </div>

        <div class="stat">

            <p>🔥 PERFECT DAYS</p>

            <h2 id="perfectCount">0</h2>

        </div>

    </div>


    <!-- LEGEND -->

    <div class="legend">

        <div class="legend-item">

            <div class="legend-box green"></div>

            Video

        </div>

        <div class="legend-item">

            <div class="legend-box orange"></div>

            LeetCode

        </div>

        <div class="legend-item">

            <div class="legend-box blue"></div>

            GitHub

        </div>

    </div>


    <!-- CALENDAR -->

    <div class="calendar">

        <div class="weekdays">

            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>

        </div>

        <div id="grid" class="grid"></div>

    </div>

</div>


<script>

/* ==============================
   CURRENT MONTH
============================== */

let currentDate = new Date();

let currentMonth =
    currentDate.getMonth();

let currentYear =
    currentDate.getFullYear();


/* ==============================
   STORAGE
============================== */

let data =
    JSON.parse(
        localStorage.getItem("dsaTracker")
    ) || {};


/* ==============================
   SAVE
============================== */

function save(){

    localStorage.setItem(
        "dsaTracker",
        JSON.stringify(data)
    );

}


/* ==============================
   DATE KEY
============================== */

function getKey(year,month,day){

    return `${year}-${month+1}-${day}`;

}


/* ==============================
   RENDER
============================== */

function render(){

    const grid =
        document.getElementById("grid");

    grid.innerHTML="";


    const date =
        new Date(
            currentYear,
            currentMonth,
            1
        );

    const firstDay =
        date.getDay();

    const days =
        new Date(
            currentYear,
            currentMonth + 1,
            0
        ).getDate();


    /* MONTH NAME */

    document.getElementById(
        "monthName"
    ).textContent =
        date.toLocaleString(
            "default",
            {
                month:"long",
                year:"numeric"
            }
        );


    /* EMPTY CELLS */

    for(let i=0;i<firstDay;i++){

        const empty =
            document.createElement("div");

        empty.className="day empty";

        grid.appendChild(empty);

    }


    /* DAYS */

    for(let day=1;day<=days;day++){

        const key =
            getKey(
                currentYear,
                currentMonth,
                day
            );


        if(!data[key]){

            data[key]={
                video:false,
                leetcode:false,
                github:false
            };

        }


        const cell =
            document.createElement("div");

        cell.className="day";


        /* DATE */

        const number =
            document.createElement("div");

        number.className="day-number";

        number.textContent=day;

        cell.appendChild(number);


        /* TASKS */

        const tasks =
            document.createElement("div");

        tasks.className="tasks";


        /* VIDEO */

        const video =
            createTask(
                "video",
                "📺 Video",
                key
            );


        /* LEETCODE */

        const leetcode =
            createTask(
                "leetcode",
                "🧩 LeetCode",
                key
            );


        /* GITHUB */

        const github =
            createTask(
                "github",
                "🐙 GitHub",
                key
            );


        tasks.appendChild(video);
        tasks.appendChild(leetcode);
        tasks.appendChild(github);

        cell.appendChild(tasks);

        grid.appendChild(cell);

    }


    updateStats();

}


/* ==============================
   CREATE TASK
============================== */

function createTask(type,title,key){

    const el =
        document.createElement("div");

    el.className =
        `task ${type}`;


    if(data[key][type]){

        el.classList.add("active");

    }


    el.title=title;


    el.onclick=function(){

        data[key][type] =
            !data[key][type];

        save();

        render();

    };


    return el;

}


/* ==============================
   STATS
============================== */

function updateStats(){

    let videos=0;
    let leetcode=0;
    let github=0;
    let perfect=0;


    Object.keys(data).forEach(key=>{

        const d=data[key];


        /* Only current month */

        if(
            key.startsWith(
                `${currentYear}-${currentMonth+1}-`
            )
        ){

            if(d.video)
                videos++;

            if(d.leetcode)
                leetcode++;

            if(d.github)
                github++;

            if(
                d.video &&
                d.leetcode &&
                d.github
            ){

                perfect++;

            }

        }

    });


    document.getElementById(
        "videoCount"
    ).textContent=videos;


    document.getElementById(
        "leetcodeCount"
    ).textContent=leetcode;


    document.getElementById(
        "githubCount"
    ).textContent=github;


    document.getElementById(
        "perfectCount"
    ).textContent=perfect;

}


/* ==============================
   MONTH NAVIGATION
============================== */

function previousMonth(){

    currentMonth--;

    if(currentMonth<0){

        currentMonth=11;
        currentYear--;

    }

    render();

}


function nextMonth(){

    currentMonth++;

    if(currentMonth>11){

        currentMonth=0;
        currentYear++;

    }

    render();

}


/* ==============================
   START
============================== */

render();

</script>

</body>
</html>
