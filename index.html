<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DSA Daily Tracker</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0d1117;
    color:#e6edf3;
    font-family:Arial, sans-serif;
    padding:40px;
}

.container{
    max-width:1100px;
    margin:auto;
}

/* ==============================
   NAVIGATION
============================== */

.nav{
    display:flex;
    gap:10px;
    margin-bottom:30px;
    border-bottom:1px solid #21262d;
    padding-bottom:15px;
}

.nav button{
    background:#161b22;
    color:#8b949e;
    border:1px solid #30363d;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
}

.nav button:hover{
    background:#21262d;
    color:white;
}

.nav button.active{
    color:#58a6ff;
    border-color:#58a6ff;
}

/* ==============================
   PAGES
============================== */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ==============================
   HEADER
============================== */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.title h1{
    font-size:28px;
}

.title p{
    color:#8b949e;
    margin-top:6px;
}

/* ==============================
   MONTH
============================== */

.month{
    display:flex;
    align-items:center;
    gap:15px;
}

.month button{
    background:#161b22;
    color:white;
    border:1px solid #30363d;
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
}

.month button:hover{
    background:#21262d;
}

#monthName{
    font-weight:bold;
}

/* ==============================
   STATS
============================== */

.stats{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

.stat{
    background:#161b22;
    border:1px solid #30363d;
    padding:18px 25px;
    border-radius:8px;
    min-width:150px;
}

.stat p{
    color:#8b949e;
    font-size:13px;
    margin-bottom:7px;
}

.stat h2{
    font-size:24px;
}

/* ==============================
   LEGEND
============================== */

.legend{
    display:flex;
    gap:20px;
    margin-bottom:18px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:#8b949e;
}

.legend-box{
    width:13px;
    height:13px;
    border-radius:3px;
}

.green{
    background:#39d353;
}

.orange{
    background:#f0883e;
}

.blue{
    background:#58a6ff;
}

/* ==============================
   CALENDAR
============================== */

.calendar{
    background:#161b22;
    border:1px solid #30363d;
    padding:25px;
    border-radius:10px;
    overflow-x:auto;
}

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
    margin-bottom:10px;
}

.weekdays div{
    text-align:center;
    color:#8b949e;
    font-size:12px;
}

/* ==============================
   DAYS
============================== */

.grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.day{
    min-height:85px;
    border:1px solid #30363d;
    border-radius:6px;
    padding:7px;
    background:#0d1117;
}

.day-number{
    font-size:12px;
    color:#8b949e;
    margin-bottom:8px;
}

/* ==============================
   TASK BUTTONS
============================== */

.tasks{
    display:flex;
    gap:5px;
}

.task{
    width:19px;
    height:19px;
    border-radius:4px;
    border:1px solid #30363d;
    cursor:pointer;
    transition:.15s;
}

.task:hover{
    transform:scale(1.1);
}

.video.active{
    background:#39d353;
    border-color:#39d353;
}

.leetcode.active{
    background:#f0883e;
    border-color:#f0883e;
}

.github.active{
    background:#58a6ff;
    border-color:#58a6ff;
}

/* ==============================
   EMPTY DAYS
============================== */

.empty{
    visibility:hidden;
}

/* =========================================================
   DSA TOPICS PAGE
========================================================= */

.topics-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.topics-header h1{
    font-size:28px;
}

.topics-header p{
    color:#8b949e;
    margin-top:6px;
}

.add-btn{
    background:#238636;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn:hover{
    background:#2ea043;
}

/* ==============================
   TOPIC PROGRESS
============================== */

.topic-progress{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
}

.progress-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.progress-header span{
    color:#8b949e;
}

.progress-bar{
    width:100%;
    height:13px;
    background:#30363d;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#58a6ff;
    transition:.3s;
}

/* ==============================
   ADD TOPIC FORM
============================== */

.add-topic-box{
    display:none;
    background:#161b22;
    border:1px solid #30363d;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.add-topic-box.show{
    display:block;
}

.add-topic-box h3{
    margin-bottom:15px;
}

.topic-form{
    display:flex;
    gap:10px;
}

.topic-input{
    flex:1;
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
    padding:11px;
    border-radius:7px;
    outline:none;
}

.topic-input:focus{
    border-color:#58a6ff;
}

.save-topic{
    background:#58a6ff;
    color:#0d1117;
    border:none;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.cancel-topic{
    background:transparent;
    color:#8b949e;
    border:1px solid #30363d;
    padding:10px 15px;
    border-radius:7px;
    cursor:pointer;
}

/* ==============================
   TOPIC LIST
============================== */

.topic-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.topic{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:8px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.topic-left{
    display:flex;
    align-items:center;
    gap:13px;
    min-width:0;
}

/* CHECKBOX */

.topic-checkbox{
    appearance:none;
    width:21px;
    height:21px;
    min-width:21px;
    border:2px solid #8b949e;
    border-radius:5px;
    cursor:pointer;
    position:relative;
}

.topic-checkbox:checked{
    background:#238636;
    border-color:#238636;
}

.topic-checkbox:checked::after{
    content:"✓";
    position:absolute;
    left:3px;
    top:-2px;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.topic.completed .topic-name{
    text-decoration:line-through;
    color:#6e7681;
}

.topic-name{
    word-break:break-word;
}

/* DELETE */

.delete-btn{
    background:transparent;
    border:none;
    color:#8b949e;
    cursor:pointer;
    font-size:17px;
}

.delete-btn:hover{
    color:#f85149;
}

/* EMPTY */

.empty-topics{
    text-align:center;
    padding:50px 20px;
    background:#161b22;
    border:1px dashed #30363d;
    border-radius:10px;
    color:#8b949e;
}

.empty-topics h3{
    color:white;
    margin-bottom:7px;
}

.empty-icon{
    font-size:40px;
    margin-bottom:12px;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:700px){

    body{
        padding:20px;
    }

    .nav{
        overflow-x:auto;
    }

    .nav button{
        white-space:nowrap;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
    }

    .stats{
        flex-wrap:wrap;
    }

    .stat{
        flex:1;
        min-width:130px;
    }

    .topics-header{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .add-btn{
        width:100%;
    }

    .topic-form{
        flex-direction:column;
    }

    .save-topic,
    .cancel-topic{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- ==============================
         NAVIGATION
    ============================== -->

    <div class="nav">

        <button
            id="trackerNav"
            class="active"
            onclick="showPage('trackerPage',this)">

            📅 Daily Tracker

        </button>

        <button
            id="topicsNav"
            onclick="showPage('topicsPage',this)">

            📚 DSA Topics

        </button>

    </div>


    <!-- =====================================================
         DAILY TRACKER PAGE
    ===================================================== -->

    <div id="trackerPage" class="page active">

        <!-- HEADER -->

        <div class="header">

            <div class="title">

                <h1>DSA Daily Tracker</h1>

                <p>
                    One video • One LeetCode • One GitHub push
                </p>

            </div>

            <div class="month">

                <button onclick="previousMonth()">
                    ‹
                </button>

                <span id="monthName"></span>

                <button onclick="nextMonth()">
                    ›
                </button>

            </div>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <p>📺 VIDEOS</p>

                <h2 id="videoCount">0</h2>

            </div>


            <div class="stat">

                <p>🟧 LEETCODE</p>

                <h2 id="leetcodeCount">0</h2>

            </div>


            <div class="stat">

                <p>🔵 GITHUB</p>

                <h2 id="githubCount">0</h2>

            </div>


            <div class="stat">

                <p>🔥 PERFECT DAYS</p>

                <h2 id="perfectCount">0</h2>

            </div>

        </div>


        <!-- LEGEND -->

        <div class="legend">

            <div class="legend-item">

                <div class="legend-box green"></div>

                Video

            </div>


            <div class="legend-item">

                <div class="legend-box orange"></div>

                LeetCode

            </div>


            <div class="legend-item">

                <div class="legend-box blue"></div>

                GitHub

            </div>

        </div>


        <!-- CALENDAR -->

        <div class="calendar">

            <div class="weekdays">

                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>

            </div>


            <div id="grid" class="grid"></div>

        </div>

    </div>


    <!-- =====================================================
         DSA TOPICS PAGE
    ===================================================== -->

    <div id="topicsPage" class="page">

        <!-- HEADER -->

        <div class="topics-header">

            <div>

                <h1>📚 DSA Topics</h1>

                <p>
                    Create your own DSA roadmap and track it.
                </p>

            </div>


            <button
                class="add-btn"
                onclick="toggleTopicForm()">

                + Add Topic

            </button>

        </div>


        <!-- PROGRESS -->

        <div class="topic-progress">

            <div class="progress-header">

                <strong>DSA Progress</strong>

                <span id="topicProgressText">
                    0 / 0
                </span>

            </div>


            <div class="progress-bar">

                <div
                    id="topicProgressFill"
                    class="progress-fill">
                </div>

            </div>

        </div>


        <!-- ADD TOPIC -->

        <div
            id="addTopicBox"
            class="add-topic-box">

            <h3>
                ➕ Add DSA Topic
            </h3>


            <div class="topic-form">

                <input
                    id="topicInput"
                    class="topic-input"
                    type="text"
                    maxlength="100"
                    placeholder="Example: Arrays"
                    autocomplete="off">


                <button
                    class="save-topic"
                    onclick="addTopic()">

                    Add

                </button>


                <button
                    class="cancel-topic"
                    onclick="closeTopicForm()">

                    Cancel

                </button>

            </div>

        </div>


        <!-- TOPICS -->

        <div
            id="topicList"
            class="topic-list">
        </div>

    </div>

</div>


<script>

/* =========================================================
   DAILY TRACKER
========================================================= */

/* CURRENT MONTH */

let currentDate = new Date();

let currentMonth =
    currentDate.getMonth();

let currentYear =
    currentDate.getFullYear();


/* STORAGE */

let data =
    JSON.parse(
        localStorage.getItem("dsaTracker")
    ) || {};


/* SAVE */

function save(){

    localStorage.setItem(
        "dsaTracker",
        JSON.stringify(data)
    );

}


/* DATE KEY */

function getKey(year,month,day){

    return `${year}-${month+1}-${day}`;

}


/* RENDER */

function render(){

    const grid =
        document.getElementById("grid");

    grid.innerHTML="";


    const date =
        new Date(
            currentYear,
            currentMonth,
            1
        );


    const firstDay =
        date.getDay();


    const days =
        new Date(
            currentYear,
            currentMonth + 1,
            0
        ).getDate();


    /* MONTH NAME */

    document.getElementById(
        "monthName"
    ).textContent =
        date.toLocaleString(
            "default",
            {
                month:"long",
                year:"numeric"
            }
        );


    /* EMPTY CELLS */

    for(let i=0;i<firstDay;i++){

        const empty =
            document.createElement("div");

        empty.className="day empty";

        grid.appendChild(empty);

    }


    /* DAYS */

    for(let day=1;day<=days;day++){

        const key =
            getKey(
                currentYear,
                currentMonth,
                day
            );


        if(!data[key]){

            data[key]={
                video:false,
                leetcode:false,
                github:false
            };

        }


        const cell =
            document.createElement("div");

        cell.className="day";


        /* DATE */

        const number =
            document.createElement("div");

        number.className="day-number";

        number.textContent=day;

        cell.appendChild(number);


        /* TASKS */

        const tasks =
            document.createElement("div");

        tasks.className="tasks";


        const video =
            createTask(
                "video",
                "📺 Video",
                key
            );


        const leetcode =
            createTask(
                "leetcode",
                "🧩 LeetCode",
                key
            );


        const github =
            createTask(
                "github",
                "🐙 GitHub",
                key
            );


        tasks.appendChild(video);
        tasks.appendChild(leetcode);
        tasks.appendChild(github);

        cell.appendChild(tasks);

        grid.appendChild(cell);

    }


    updateStats();

}


/* CREATE TASK */

function createTask(type,title,key){

    const el =
        document.createElement("div");

    el.className =
        `task ${type}`;


    if(data[key][type]){

        el.classList.add("active");

    }


    el.title=title;


    el.onclick=function(){

        data[key][type] =
            !data[key][type];

        save();

        render();

    };


    return el;

}


/* STATS */

function updateStats(){

    let videos=0;
    let leetcode=0;
    let github=0;
    let perfect=0;


    Object.keys(data).forEach(key=>{

        const d=data[key];


        if(
            key.startsWith(
                `${currentYear}-${currentMonth+1}-`
            )
        ){

            if(d.video)
                videos++;

            if(d.leetcode)
                leetcode++;

            if(d.github)
                github++;

            if(
                d.video &&
                d.leetcode &&
                d.github
            ){

                perfect++;

            }

        }

    });


    document.getElementById(
        "videoCount"
    ).textContent=videos;


    document.getElementById(
        "leetcodeCount"
    ).textContent=leetcode;


    document.getElementById(
        "githubCount"
    ).textContent=github;


    document.getElementById(
        "perfectCount"
    ).textContent=perfect;

}


/* MONTH NAVIGATION */

function previousMonth(){

    currentMonth--;

    if(currentMonth<0){

        currentMonth=11;
        currentYear--;

    }

    render();

}


function nextMonth(){

    currentMonth++;

    if(currentMonth>11){

        currentMonth=0;
        currentYear++;

    }

    render();

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function showPage(pageId,button){

    document
        .querySelectorAll(".page")
        .forEach(page=>{

            page.classList.remove("active");

        });


    document
        .getElementById(pageId)
        .classList.add("active");


    document
        .querySelectorAll(".nav button")
        .forEach(btn=>{

            btn.classList.remove("active");

        });


    button.classList.add("active");


    if(pageId==="topicsPage"){

        renderTopics();

    }

}


/* =========================================================
   DSA TOPICS
========================================================= */

/*
    Topics use a SEPARATE localStorage key:

    dsaTopics

    Therefore your existing daily tracker data
    stored in "dsaTracker" remains untouched.
*/

let topics =
    JSON.parse(
        localStorage.getItem("dsaTopics")
    ) || [];


/* SAVE TOPICS */

function saveTopics(){

    localStorage.setItem(
        "dsaTopics",
        JSON.stringify(topics)
    );

}


/* OPEN / CLOSE FORM */

function toggleTopicForm(){

    const box =
        document.getElementById(
            "addTopicBox"
        );


    box.classList.toggle("show");


    if(box.classList.contains("show")){

        document
            .getElementById("topicInput")
            .focus();

    }

}


function closeTopicForm(){

    document
        .getElementById("addTopicBox")
        .classList.remove("show");


    document
        .getElementById("topicInput")
        .value="";

}


/* ADD TOPIC */

function addTopic(){

    const input =
        document.getElementById(
            "topicInput"
        );


    const name =
        input.value.trim();


    if(!name){

        alert("Enter a topic name.");

        input.focus();

        return;

    }


    /* DUPLICATE CHECK */

    const exists =
        topics.some(
            topic =>
                topic.name.toLowerCase() ===
                name.toLowerCase()
        );


    if(exists){

        alert("This topic already exists.");

        input.focus();

        return;

    }


    /* CREATE TOPIC */

    topics.push({

        id:Date.now(),

        name:name,

        completed:false

    });


    saveTopics();


    input.value="";


    closeTopicForm();


    renderTopics();

}


/* TOGGLE TOPIC */

function toggleTopic(id){

    const topic =
        topics.find(
            topic => topic.id === id
        );


    if(!topic)
        return;


    topic.completed =
        !topic.completed;


    saveTopics();


    renderTopics();

}


/* DELETE TOPIC */

function deleteTopic(id){

    const topic =
        topics.find(
            topic => topic.id === id
        );


    if(!topic)
        return;


    if(
        !confirm(
            `Delete "${topic.name}"?`
        )
    ){

        return;

    }


    topics =
        topics.filter(
            topic => topic.id !== id
        );


    saveTopics();


    renderTopics();

}


/* ESCAPE HTML */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}


/* RENDER TOPICS */

function renderTopics(){

    const list =
        document.getElementById(
            "topicList"
        );


    const progressText =
        document.getElementById(
            "topicProgressText"
        );


    const progressFill =
        document.getElementById(
            "topicProgressFill"
        );


    /* EMPTY */

    if(topics.length===0){

        list.innerHTML=`

            <div class="empty-topics">

                <div class="empty-icon">
                    📚
                </div>

                <h3>
                    No DSA Topics Yet
                </h3>

                <p>
                    Add your first topic to start
                    building your roadmap.
                </p>

            </div>

        `;


        progressText.textContent="0 / 0";

        progressFill.style.width="0%";

        return;

    }


    /* PROGRESS */

    const completed =
        topics.filter(
            topic => topic.completed
        ).length;


    const total =
        topics.length;


    const percentage =
        Math.round(
            (completed / total) * 100
        );


    progressText.textContent =
        `${completed} / ${total}`;


    progressFill.style.width =
        percentage + "%";


    /* LIST */

    list.innerHTML =
        topics.map(topic=>`

            <div
                class="topic
                ${topic.completed
                    ? "completed"
                    : ""}">

                <div class="topic-left">

                    <input
                        type="checkbox"
                        class="topic-checkbox"
                        ${topic.completed
                            ? "checked"
                            : ""}
                        onchange="
                            toggleTopic(${topic.id})
                        ">

                    <span class="topic-name">
                        ${escapeHTML(topic.name)}
                    </span>

                </div>


                <button
                    class="delete-btn"
                    onclick="
                        deleteTopic(${topic.id})
                    "
                    title="Delete topic">

                    🗑️

                </button>

            </div>

        `).join("");

}


/* ENTER KEY */

document
    .getElementById("topicInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key==="Enter"){

                addTopic();

            }

        }
    );


/* =========================================================
   START
========================================================= */

render();

renderTopics();

</script>

</body>
</html>
